<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b3d91">
<title>Rademacher · App</title>
<link rel="stylesheet" href="/app.css">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/i18n.js"></script>
<style>
  .step { display: flex; gap: 12px; align-items: flex-start; margin: 14px 0; font-size: 1.05rem; }
  .step .n { flex: none; width: 34px; height: 34px; border-radius: 50%; background: #f59e0b; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .big-btn { width: 100%; font-size: 1.15rem; padding: 18px; margin-top: 8px; }
</style>
</head>
<body>
<header class="top">
  <h1>Rademacher · Girona</h1>
  <select id="lang" class="lang" aria-label="Language"></select>
</header>
<main class="driver">
  <div class="card" style="text-align:center">
    <img src="/icon-192.png" alt="" width="84" height="84" style="border-radius:18px">
    <h2 data-t="getApp" style="margin:10px 0 0"></h2>
  </div>

  <!-- iPhone / iPad -->
  <section id="ios" class="card hidden" style="margin-top:12px">
    <div class="step"><div class="n">1</div><div><a class="btn big-btn" href="/chofer" data-t="openApp"></a></div></div>
    <div class="step"><div class="n">2</div><div data-t="iosHint"></div></div>
    <div class="step"><div class="n">3</div><div><b data-t="enterCode"></b><br><span class="muted" data-t="codeHint"></span></div></div>
  </section>

  <!-- Otros (PC, Android sin redirección) -->
  <section id="other" class="card hidden" style="margin-top:12px">
    <a class="btn big-btn" id="apkBtn" href="/app" data-t="downloadApk"></a>
    <a class="btn big-btn secondary" href="/chofer" data-t="openApp" style="display:block;margin-top:10px"></a>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let lang = pickLang((() => { try { return localStorage.getItem('lang'); } catch { return null; } })());
const t = (k) => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;
function apply() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
}
for (const [k, v] of Object.entries(I18N)) $('lang').add(new Option(v._name, k, false, k === lang));
$('lang').onchange = (e) => { lang = e.target.value; try { localStorage.setItem('lang', lang); } catch {} apply(); };
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
$(isIOS ? 'ios' : 'other').classList.remove('hidden');
apply();
</script>
</body>
</html>
