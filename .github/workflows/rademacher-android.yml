name: APK Rademacher Muelles

# Compila la app Android del chófer en GitHub (los runners ya traen el SDK de Android).
# - En pull requests: solo compila y deja el APK como artefacto (comprobación).
# - En main o ejecución manual: además publica una Release con el APK para descargar desde el móvil.
on:
  push:
    branches: [main]
    paths: ['rademacher-android/**', 'rademacher-muelles/public/**', '.github/workflows/rademacher-android.yml']
  pull_request:
    paths: ['rademacher-android/**', '.github/workflows/rademacher-android.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: rademacher-android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Firma (opcional)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.RADEMACHER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rademacher.jks"
            echo "path=$RUNNER_TEMP/rademacher.jks" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          SERVER_URL: ${{ vars.RADEMACHER_SERVER_URL }}
          RADEMACHER_KEYSTORE_PATH: ${{ steps.sign.outputs.path }}
          RADEMACHER_KEYSTORE_PASSWORD: ${{ secrets.RADEMACHER_KEYSTORE_PASSWORD }}
          RADEMACHER_KEY_ALIAS: ${{ secrets.RADEMACHER_KEY_ALIAS }}
          RADEMACHER_KEY_PASSWORD: ${{ secrets.RADEMACHER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon ${{ steps.sign.outputs.task }}
          cp "${{ steps.sign.outputs.apk }}" "RademacherMuelles-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: rademacher-apk
          path: rademacher-android/RademacherMuelles-*.apk

      - name: Publicar Release con el APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: muelles-v1.0.${{ github.run_number }}
          name: Rademacher Muelles 1.0.${{ github.run_number }}
          body: |
            App Android del chófer. Descargue **RademacherMuelles-1.0.${{ github.run_number }}.apk** desde el móvil y ábralo para instalar.
            Android pedirá permiso para instalar apps de origen desconocido (solo la primera vez).
          files: rademacher-android/RademacherMuelles-*.apk
