name: APK Nexus

# Compila la app Android Nexus (red social del conocimiento) en GitHub; los runners ya traen el SDK de Android.
# - En pull requests: ejecuta los tests y deja el APK como artefacto (comprobación).
# - En main o ejecución manual: además publica una Release con el APK para descargarlo desde el móvil.
on:
  push:
    branches: [main]
    paths: ['nexus-android/**', '.github/workflows/nexus-android.yml']
  pull_request:
    paths: ['nexus-android/**', '.github/workflows/nexus-android.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: nexus-android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Firma (opcional)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/nexus.jks"
            echo "path=$RUNNER_TEMP/nexus.jks" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            # Sin clave propia: APK de depuración. Se instala igual, pero cada versión nueva
            # obliga a desinstalar la anterior porque la clave de depuración cambia en cada build.
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 2.0.${{ github.run_number }}
          NEXUS_KEYSTORE_PATH: ${{ steps.sign.outputs.path }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon ${{ steps.sign.outputs.task }}
          cp "${{ steps.sign.outputs.apk }}" "Nexus-2.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-apk
          path: nexus-android/Nexus-*.apk

      - name: Publicar Release con el APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-v2.0.${{ github.run_number }}
          name: Nexus 2.0.${{ github.run_number }}
          body: |
            Red social del conocimiento para Android. Descarga **Nexus-2.0.${{ github.run_number }}.apk** desde el móvil y ábrelo para instalar.
            Android pedirá permiso para instalar apps de origen desconocido (solo la primera vez).
          files: nexus-android/Nexus-*.apk
