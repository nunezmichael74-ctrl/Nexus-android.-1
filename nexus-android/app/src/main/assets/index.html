<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F9FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111A2C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Nexus Knowledge · demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317233B'/%3E%3Cpath d='M18 46V18l28 28V18' stroke='%23FFE45C' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   Nexus Knowledge — demo interactiva (un solo archivo, sin conexión)
   Identidad: cuaderno cuadriculado + tinta azul + subrayador fluorescente
   ===================================================================== */
:root {
  --paper: #F7F9FC;
  --sheet: #FFFFFF;
  --grid: #E2EAF4;
  --ink: #17233B;
  --ink-soft: #55627C;
  --rule: #D5DEEA;
  --margin: #E4625C;
  --hl: #FFE45C;
  --hl-soft: #FFF3A8;
  --ok: #1E8A55;
  --ok-soft: #E3F4EA;
  --danger: #B42318;
  --focus: #3157D5;
  --shadow: 0 1px 0 #D5DEEA, 0 8px 24px -16px rgba(23, 35, 59, .35);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tabbar-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111A2C; --sheet: #172238; --grid: #1C2840; --ink: #E8EDF6; --ink-soft: #9DAAC3;
    --rule: #2A3756; --margin: #B4544F; --hl: #D9C23A; --hl-soft: #4A4422; --ok: #4CC38A; --ok-soft: #173A2C;
    --danger: #F2827A; --focus: #8FA9FF; --shadow: 0 1px 0 #24314E, 0 10px 24px -18px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111A2C; --sheet: #172238; --grid: #1C2840; --ink: #E8EDF6; --ink-soft: #9DAAC3;
  --rule: #2A3756; --margin: #B4544F; --hl: #D9C23A; --hl-soft: #4A4422; --ok: #4CC38A; --ok-soft: #173A2C;
  --danger: #F2827A; --focus: #8FA9FF; --shadow: 0 1px 0 #24314E, 0 10px 24px -18px rgba(0,0,0,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font: 16px/1.5 var(--sans);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  background-attachment: fixed;
  min-height: 100dvh;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
mark { background: linear-gradient(transparent 52%, var(--hl) 52%, var(--hl) 92%, transparent 92%); color: inherit; padding: 0 .1em; }

/* --- Estructura ------------------------------------------------------------ */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; font: 700 20px/1 var(--serif); letter-spacing: -.01em; }
.brand svg { width: 28px; height: 28px; flex: none; }
.topbar .title { flex: 1; min-width: 0; font-weight: 600; color: var(--ink-soft); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; }
.icon-btn:hover { background: var(--grid); }
.icon-btn svg { width: 22px; height: 22px; }
.dot-badge { position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--margin); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }

main:focus { outline: none; }
main { position: relative; max-width: 760px; margin: 0 auto; padding: 16px 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 32px) 30px; }
main::before { content: ""; position: fixed; top: 0; bottom: 0; left: max(14px, calc(50% - 366px)); width: 1.5px; background: var(--margin); opacity: .55; pointer-events: none; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)); background: var(--sheet); border-top: 1px solid var(--rule);
}
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: var(--ink-soft); font-size: 12px; font-weight: 600; border-radius: 12px; }
.tabbar a svg { width: 24px; height: 24px; }
.tabbar a[aria-current="page"] { color: var(--ink); }
.tabbar a[aria-current="page"] span { background: linear-gradient(transparent 55%, var(--hl) 55%); }
@media (min-width: 900px) {
  .tabbar { left: 50%; right: auto; bottom: 16px; transform: translateX(-50%); width: 560px; border: 1px solid var(--rule); border-radius: 18px; box-shadow: var(--shadow); }
}

/* --- Tipografía --------------------------------------------------------------- */
h1, h2, h3 { font-family: var(--serif); letter-spacing: -.01em; margin: 0; }
h1 { font-size: 30px; line-height: 1.15; }
h2 { font-size: 22px; line-height: 1.25; }
h3 { font-size: 18px; line-height: 1.3; }
.muted { color: var(--ink-soft); }
.small { font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-soft); font-size: 13px; }
.meta span { display: inline-flex; align-items: center; gap: 4px; }
.meta svg { width: 15px; height: 15px; }

/* --- Controles --------------------------------------------------------------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); font-weight: 650; text-decoration: none; }
.btn.secondary { background: transparent; color: var(--ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1.5px solid var(--rule); background: var(--sheet); font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.chip .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: 1px; }
.segmented { display: inline-flex; padding: 4px; gap: 4px; border-radius: 14px; background: var(--grid); }
.segmented button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; font-weight: 650; font-size: 14px; color: var(--ink-soft); }
.segmented button[aria-selected="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 650; font-size: 14px; }
.input, textarea.input, select.input { width: 100%; min-height: 46px; padding: 11px 14px; border: 1.5px solid var(--rule); border-radius: 12px; background: var(--sheet); font-weight: 400; font-size: 16px; }
textarea.input { min-height: 140px; resize: vertical; line-height: 1.5; }
.input:focus { border-color: var(--ink); outline: none; }
.hint { font-weight: 400; font-size: 13px; color: var(--ink-soft); }
.error-text { color: var(--danger); font-size: 13px; font-weight: 500; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); color: var(--ink-soft); }
.search .input { padding-left: 44px; }

/* --- Hojas (preguntas, respuestas) ---------------------------------------------- */
.sheet { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px 14px 14px 4px; box-shadow: var(--shadow); }
.q-list { display: flex; flex-direction: column; gap: 12px; }
.q-item { display: block; padding: 14px 16px 14px 20px; text-decoration: none; }
.q-item::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 5px; border-radius: 0 4px 4px 0; background: var(--cat, var(--ink-soft)); }
.q-item h3 { font-size: 18px; margin: 4px 0 6px; }
.q-item p { margin: 0 0 10px; color: var(--ink-soft); font-size: 14.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cat-name { font-size: 13px; font-weight: 700; color: var(--cat, var(--ink-soft)); }
:root[data-theme="dark"] .cat-name { color: color-mix(in srgb, var(--cat, var(--ink-soft)) 55%, white); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cat-name { color: color-mix(in srgb, var(--cat, var(--ink-soft)) 55%, white); } }
.reason { font-size: 12.5px; color: var(--ink-soft); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); padding: 2px 8px; border-radius: 6px; background: var(--grid); }
.solved { display: inline-flex; align-items: center; gap: 4px; color: var(--ok); font-weight: 700; }
.solved svg { width: 17px; height: 17px; }

.efe { padding: 16px 18px 16px 20px; display: grid; gap: 6px; }
.efe .when { font-size: 13px; font-weight: 700; color: var(--margin); }
.efe .year { font: 700 40px/1 var(--serif); letter-spacing: -.02em; }

/* --- Detalle --------------------------------------------------------------- */
.detail-head { display: grid; gap: 10px; }
.post { display: grid; grid-template-columns: 48px 1fr; gap: 12px; padding: 16px; }
.post.accepted { border-color: color-mix(in srgb, var(--ok) 55%, var(--rule)); }
.post.accepted::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; border: 2px solid var(--ok); pointer-events: none; opacity: .55; }
.vote { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.vote button { display: grid; place-items: center; width: 44px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-soft); }
.vote button:hover:not(:disabled) { background: var(--grid); }
.vote button[aria-pressed="true"] { color: var(--ink); background: var(--hl-soft); }
.vote button:disabled { opacity: .35; cursor: not-allowed; }
.vote svg { width: 24px; height: 24px; }
.vote .score { font: 700 18px/1 var(--sans); font-variant-numeric: tabular-nums; }
.accept { margin-top: 6px; }
.accept button { width: 44px; height: 44px; color: var(--ink-soft); border: 1.5px dashed var(--rule); }
.accept button[aria-pressed="true"] { color: #fff; background: var(--ok); border-color: var(--ok); }
.accept-static { margin-top: 8px; color: var(--ok); }
.accept-static svg { width: 30px; height: 30px; }
.solution-flag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 8px; background: var(--ok-soft); color: var(--ok); font-weight: 700; font-size: 13px; }
.solution-flag svg { width: 16px; height: 16px; }
.md p { margin: 0 0 10px; }
.md p:last-child { margin-bottom: 0; }
.md ul { margin: 0 0 10px; padding-left: 20px; }
.md code { padding: 1px 5px; border-radius: 5px; background: var(--grid); font-size: .92em; }
.author { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
.avatar { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 12px; flex: none; }
.rep { display: inline-block; padding: 0 6px; border-radius: 6px; background: var(--grid); font-weight: 700; font-size: 12px; color: var(--ink); }
.ai { padding: 16px 18px; border-style: dashed; background: color-mix(in srgb, var(--hl-soft) 40%, var(--sheet)); }
.ai summary { cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 8px; list-style: none; }
.ai summary::-webkit-details-marker { display: none; }
.ai summary svg { width: 18px; height: 18px; }
.ai ul { margin: 10px 0; padding-left: 20px; }
.ai .ref { color: var(--ink-soft); white-space: nowrap; }
.related a { display: block; padding: 10px 0; border-top: 1px solid var(--rule); text-decoration: none; font-weight: 600; }
.related a:first-of-type { border-top: 0; }

/* --- Historia --------------------------------------------------------------- */
.era-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.era-bar .btn { flex: none; white-space: nowrap; }
.timeline { position: relative; overflow-x: auto; overflow-y: hidden; margin: 0 -16px 0 -30px; padding: 0 16px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.track { position: relative; height: 350px; }
.axis { position: absolute; left: 0; right: 0; top: 175px; height: 2px; background: var(--ink); }
.tick { position: absolute; top: 202px; width: 2px; height: 18px; background: var(--ink); }
.tick span { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); font: 700 13px/1 var(--serif); white-space: nowrap; color: var(--ink-soft); }
.ev { position: absolute; width: 190px; scroll-snap-align: center; }
.ev .stem { position: absolute; left: 0; width: 2px; background: var(--ev); opacity: .6; }
.ev .pin { position: absolute; left: -6px; width: 14px; height: 14px; border-radius: 50%; background: var(--ev); border: 3px solid var(--paper); top: 168px; }
.ev button { position: absolute; left: 0; width: 190px; text-align: left; padding: 10px 12px 10px 14px; border: 1px solid var(--rule); border-left: 4px solid var(--ev); border-radius: 4px 12px 12px 4px; background: var(--sheet); box-shadow: var(--shadow); }
.ev .ev-year { font: 700 14px/1.2 var(--sans); color: var(--ev); }
.ev .ev-title { display: block; margin-top: 2px; font: 600 15px/1.25 var(--serif); }
.ev .ev-debates { display: block; margin-top: 4px; font-size: 12px; color: var(--ink-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-soft); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }

/* --- Proyectos y perfil ------------------------------------------------------ */
.project { padding: 16px 18px; display: grid; gap: 8px; text-decoration: none; }
.status { display: inline-block; padding: 2px 9px; border-radius: 7px; font-size: 12.5px; font-weight: 700; }
.status.recruiting { background: var(--hl-soft); color: var(--ink); }
.status.active { background: var(--ok-soft); color: var(--ok); }
.status.completed { background: var(--grid); color: var(--ink-soft); }
.timeline-list { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--rule); display: grid; gap: 14px; }
.timeline-list li { position: relative; }
.timeline-list li::before { content: ""; position: absolute; left: -25px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--sheet); border: 2px solid var(--ink); }
.profile-head { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; padding: 18px; }
.profile-head .avatar { width: 64px; height: 64px; font-size: 26px; }
.rep-big { font: 700 44px/1 var(--serif); letter-spacing: -.02em; }
.progress { height: 10px; border-radius: 5px; background: var(--grid); overflow: hidden; }
.progress > div { height: 100%; background: var(--hl); border-right: 2px solid var(--ink); transition: width .5s ease; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.badge { padding: 12px; border: 1.5px dashed var(--rule); border-radius: 12px; display: grid; gap: 2px; }
.badge.on { border-style: solid; border-color: var(--ink); background: var(--sheet); }
.badge b { font-family: var(--serif); font-size: 17px; }
.ledger { list-style: none; margin: 0; padding: 0; }
.ledger li { display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.ledger .delta { min-width: 42px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.delta.pos { color: var(--ok); }
.delta.neg { color: var(--danger); }

/* --- Hoja inferior, toasts, FAB ---------------------------------------------- */
.fab { position: fixed; right: max(18px, calc(50% - 360px)); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px); z-index: 15; display: inline-flex; align-items: center; gap: 8px; height: 54px; padding: 0 20px; border: 0; border-radius: 27px; background: var(--ink); color: var(--paper); font-weight: 700; box-shadow: 0 10px 26px -10px rgba(23,35,59,.6); text-decoration: none; }
.fab svg { width: 22px; height: 22px; }
@media (min-width: 900px) { .fab { bottom: 100px; } }
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 16, 30, .45); display: none; }
.scrim.open { display: block; }
.bottom-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 86dvh; overflow: auto; padding: 8px 20px calc(24px + env(safe-area-inset-bottom)); background: var(--sheet); border-radius: 20px 20px 0 0; transform: translateY(105%); visibility: hidden; transition: transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s linear .28s; }
.bottom-sheet.open { transform: none; visibility: visible; transition: transform .28s cubic-bezier(.2,.8,.2,1); }
.bottom-sheet .grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--rule); margin: 4px auto 14px; }
@media (min-width: 760px) { .bottom-sheet { left: 50%; right: auto; width: 640px; transform: translate(-50%, 105%); border-radius: 20px 20px 0 0; } .bottom-sheet.open { transform: translate(-50%, 0); } }
.toasts { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 70px); z-index: 60; transform: translateX(-50%); display: grid; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
.toast { padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 14.5px; box-shadow: 0 12px 30px -12px rgba(0,0,0,.5); animation: toast-in .25s ease; }
.toast .plus { color: var(--hl); font-weight: 800; }
@keyframes toast-in { from { transform: translateY(-8px); opacity: 0; } }
.notif { display: grid; gap: 2px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.notif.unread b::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--margin); margin-right: 8px; vertical-align: 2px; }
.empty { padding: 28px 20px; text-align: center; color: var(--ink-soft); }
.callout { padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--ink); background: var(--hl-soft); }
.callout.warn { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--sheet)); }
.back { display: inline-flex; align-items: center; gap: 4px; margin: -4px 0 6px -8px; padding: 6px 8px; border-radius: 10px; text-decoration: none; font-weight: 600; color: var(--ink-soft); }
.back svg { width: 20px; height: 20px; }
.intro { padding: 18px 18px 18px 22px; }
.intro p { margin: 6px 0 0; color: var(--ink-soft); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>

function ago(t) {
  const s = Math.max(1, Math.round((Date.now() - t) / 1000));
  if (s < 60) return "ahora mismo";
  const m = Math.round(s / 60); if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24); if (d < 30) return d === 1 ? "ayer" : `hace ${d} días`;
  const mo = Math.round(d / 30); return mo === 1 ? "hace un mes" : `hace ${mo} meses`;
}

/* Markdown mínimo y seguro: se escapa TODO y luego se aplican negrita, cursiva, código y listas. */
function md(src) {
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return src.split(/\n{2,}/).map((block) => {
    const lines = block.split("\n");
    if (lines.every((l) => /^\s*[-*] /.test(l))) return `<ul>${lines.map((l) => `<li>${inline(l.replace(/^\s*[-*] /, ""))}</li>`).join("")}</ul>`;
    return `<p>${lines.map(inline).join("<br>")}</p>`;
  }).join("");
}

/* Resaltado insensible a acentos sobre texto ya escapado. */
function highlight(text, query) {
  const words = fold(query).split(/\s+/).filter((w) => w.length > 1);
  if (!words.length) return esc(text);
  const accent = { a: "[aá]", e: "[eé]", i: "[ií]", o: "[oó]", u: "[uúü]", n: "[nñ]" };
  const pattern = words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/[aeioun]/g, (c) => accent[c])).join("|");
  const re = new RegExp(`(${pattern})`, "gi");
  return text.split(re).map((part, i) => (i % 2 ? `<mark>${esc(part)}</mark>` : esc(part))).join("");
}

function tierOf(rep) { return [...BADGES].reverse().find((b) => rep > b.min) || null; }

function addRep(username, delta, reason) {
  if (!delta) return;
  const usr = user(username);
  const before = tierOf(usr.rep);
  usr.rep = Math.max(0, usr.rep + delta);
  if (username === ME) {
    S.ledger.unshift({ t: Date.now(), delta, text: reason });
    const after = tierOf(usr.rep);
    if (after && (!before || after.min > before.min)) setTimeout(() => toast(`Insignia desbloqueada: <span class="plus">${after.name}</span>`, 3600), 700);
  }
}

function notify(title, text, href) {
  S.notifications.unshift({ id: nextId("n"), t: Date.now(), read: false, title, text, href });
  renderBell();
}

function score(item) { return item.score + item.myVote; }

function vote(kind, qid, aid, value) {
  const q = S.questions.find((x) => x.id === qid);
  const item = kind === "q" ? q : q.answers.find((x) => x.id === aid);
  if (item.author === ME) return;
  const prev = item.myVote;
  const next = prev === value ? 0 : value;           // repetir el mismo voto lo retira
  const repOf = (v) => (v === 1 ? RULES.upvote : v === -1 ? RULES.downvote : 0);
  item.myVote = next;
  addRep(item.author, repOf(next) - repOf(prev), "");
  save();
  return { prev, next };
}

function setAccepted(qid, aid) {
  const q = S.questions.find((x) => x.id === qid);
  if (q.author !== ME) return;
  const previous = q.accepted;
  const target = previous === aid ? null : aid;      // pulsar la aceptada la retira
  if (previous) {
    const old = q.answers.find((x) => x.id === previous);
    if (old.author !== ME) addRep(old.author, -RULES.accepted, "");
  }
  q.accepted = target;
  if (target) {
    const ans = q.answers.find((x) => x.id === target);
    ans.acceptedAt = Date.now();
    if (ans.author !== ME) addRep(ans.author, RULES.accepted, "");
  }
  save();
  return { previous, target };
}

/* =====================================================================
   Heurísticas del backend (antispam y duplicados)
   ===================================================================== */
function spamCheck(title, body) {
  const text = `${title}\n${body}`;
  const reasons = [];
  const links = text.match(/https?:\/\/\S+|www\.\S+/gi) || [];
  if (links.length > 3) reasons.push(`Tiene ${links.length} enlaces (máximo 3).`);
  const letters = [...text].filter((c) => /\p{L}/u.test(c));
  const upper = letters.filter((c) => c === c.toUpperCase() && c !== c.toLowerCase());
  if (letters.length >= 20 && upper.length / letters.length > 0.5) reasons.push(`El ${Math.round((upper.length / letters.length) * 100)} % está en mayúsculas.`);
  const words = fold(text).match(/\p{L}+/gu) || [];
  if (words.length >= 12) {
    const counts = {}; words.filter((w) => w.length > 3).forEach((w) => (counts[w] = (counts[w] || 0) + 1));
    const top = Math.max(0, ...Object.values(counts));
    if (top / words.length > 0.3) reasons.push("Repite demasiado las mismas palabras.");
  }
  if (/(.)\1{9,}/.test(text)) reasons.push("Contiene caracteres repetidos.");
  return reasons;
}

const STOP = new Set("el la los las un una unos unas de del y o en a que por para con se es lo al como mas más sus su mi me te le qué que cuál cual cómo como hay entre".split(" "));
function keywords(s) { return new Set(fold(s).split(/[^a-z0-9ñ]+/).filter((w) => w.length > 2 && !STOP.has(w))); }
function similarQuestions(title, exclude = null, min = 0.34) {
  const k = keywords(title); if (k.size < 2) return [];
  return S.questions.filter((q) => q.id !== exclude).map((q) => {
    const o = keywords(q.title); const inter = [...k].filter((w) => o.has(w)).length;
    return { q, sim: inter / new Set([...k, ...o]).size };
  }).filter((x) => x.sim >= min).sort((a, b) => b.sim - a.sim).slice(0, 3);
}

function answerSnippet(q, query) {
  const words = fold(query).split(/\s+/).filter((w) => w.length > 1);
  if (!words.length || words.every((w) => fold(q.title + " " + q.body).includes(w))) return "";
  const hit = q.answers.find((a) => words.some((w) => fold(a.body).includes(w)));
  if (!hit) return "";
  const plain = hit.body.replace(/[*`]/g, "");
  const i = fold(plain).indexOf(words.find((w) => fold(plain).includes(w)));
  let start = Math.max(0, i - 50);
  if (start) start = plain.indexOf(" ", start) + 1 || start;           // empieza en una palabra completa
  let end = Math.min(plain.length, start + 140);
  if (end < plain.length) end = plain.lastIndexOf(" ", end) > i ? plain.lastIndexOf(" ", end) : end;
  const frag = (start ? "…" : "") + plain.slice(start, end) + (end < plain.length ? "…" : "");
  return `<p style="-webkit-line-clamp:3"><b style="color:var(--ink)">En una respuesta:</b> ${highlight(frag, query)}</p>`;
}

function nearestEfemeride() {
  const today = new Date(); const y = today.getFullYear();
  const withDate = HISTORY.filter((h) => h.date);
  let best = null;
  for (const h of withDate) {
    for (const yy of [y - 1, y, y + 1]) {
      const d = new Date(yy, h.date[0] - 1, h.date[1]);
      const diff = Math.round((d - new Date(y, today.getMonth(), today.getDate())) / DAY);
      if (!best || Math.abs(diff) < Math.abs(best.diff) || (Math.abs(diff) === Math.abs(best.diff) && diff > 0)) best = { h, diff, d };
    }
  }
  return best;
}

  const dateLabel = e.d.toLocaleDateString("es-ES", { day: "numeric", month: "long" });
  const years = new Date().getFullYear() - e.h.year;

  let list = [...S.questions];
  if (ui.feedCat) list = list.filter((q) => q.cat === ui.feedCat);

  else {
    // "Para ti": 0,40·recencia + 0,30·interacción + 0,20·afinidad (Logística) + 0,10·novedad
    const eng = (q) => Math.log1p(Math.max(score(q), 0) + 3 * q.answers.length);
    const maxEng = Math.max(...list.map(eng), 1);
    const rank = (q) => {
      const ageH = (Date.now() - q.created) / HOUR;

      reasons[q.id] = affinity ? "Porque sigues Logística" : engagement > 0.6 ? "Popular en la comunidad" : ageH < 6 ? "Publicada recientemente" : "";
      return 0.4 * recency + 0.3 * engagement + 0.2 * affinity + 0.1;

  $("#view").querySelectorAll("[data-feed]").forEach((b) => b.addEventListener("click", () => { ui.feed = b.dataset.feed; viewHome(); }));
  $("#view").querySelectorAll("[data-fcat]").forEach((b) => b.addEventListener("click", () => { ui.feedCat = b.dataset.fcat || null; viewHome(); }));

    const ans = target && q.answers.find((x) => x.id === target);
    if (ans) toast(ans.author === ME ? "Marcada como solución (tu propia respuesta no suma reputación)" : `Marcada como solución: <span class="plus">+10</span> para ${esc(user(ans.author).name)}`);
    else toast("Has quitado la solución");
    viewQuestion(q.id);
  }));
  const report = root.querySelector("[data-report]");
  report && report.addEventListener("click", () => openSheet(`
    <h2>Reportar pregunta</h2>
    <p class="muted">El equipo de moderación lo revisará. Con 3 reportes, el contenido se marca automáticamente para revisión.</p>
    <div class="stack" style="gap:8px">${["Spam", "Ofensivo", "Acoso", "Desinformación", "Fuera de tema", "Duplicado"].map((r) => `<button class="btn secondary" data-reason="${r}">${r}</button>`).join("")}</div>`));
  $("#sheetBody").onclick = (ev) => { const b = ev.target.closest("[data-reason]"); if (b) { closeSheet(); toast("Gracias. Lo revisará el equipo de moderación."); } };

  $("#answerForm").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const body = $("#answerBody").value.trim();
    const err = $("#answerErr");
    if (body.length < 20) { err.textContent = `Te faltan ${20 - body.length} caracteres.`; $("#answerBody").focus(); return; }
    const spam = spamCheck("", body);
    if (spam.length) { err.textContent = "Parece spam y no se ha publicado. " + spam.join(" "); return; }
    const aid = nextId("a");
    q.answers.push({ id: aid, author: ME, created: Date.now(), score: 0, myVote: 0, body });
    save();
    toast("Respuesta publicada");
    simulateCommunity(q.id, aid);
    viewQuestion(q.id);
    const el = document.getElementById(`answer-${aid}`); el && el.scrollIntoView({ behavior: "smooth", block: "center" });
  });
}

function viewHistory(params) {
  setTab("historia", "Historia");
  const themes = [...new Set(HISTORY.flatMap((h) => h.themes))].sort();
  const events = HISTORY.filter((h) => (!ui.hRegion || h.region === ui.hRegion) && (!ui.hTheme || h.themes.includes(ui.hTheme)));
  // Escala comprimida: conserva el orden y refleja los huecos sin que la Antigüedad ocupe metros de pantalla.
  const pos = []; let x = 40;
  events.forEach((h, i) => { if (i) x += 120 + Math.min(240, Math.sqrt(Math.max(0, h.year - events[i - 1].year)) * 10); pos.push(x); });
  const width = (pos[pos.length - 1] || 0) + 260;
  const eras = [["Antigüedad", -1000], ["Edad Media", 476], ["Edad Moderna", 1492], ["Edad Contemporánea", 1789]];

  $("#view").innerHTML = `
    <div class="stack">
      <div><h1>Historia</h1><p class="muted" style="margin:6px 0 0">Desliza y toca un hito para ver su fuente y los debates.</p></div>
      <div class="chips" aria-label="Región">
        <button class="chip" aria-pressed="${!ui.hRegion}" data-region="">Todas las regiones</button>
        ${Object.entries(REGIONS).map(([k, [l, col]]) => `<button class="chip" aria-pressed="${ui.hRegion === k}" data-region="${k}"><span class="swatch" style="background:${col}"></span>${l}</button>`).join("")}
      </div>
      <div class="chips" aria-label="Tema">
        <button class="chip" aria-pressed="${!ui.hTheme}" data-theme-f="">Todos los temas</button>
        ${themes.map((t) => `<button class="chip" aria-pressed="${ui.hTheme === t}" data-theme-f="${t}">${themeName(t)}</button>`).join("")}
      </div>
      <div class="era-bar">${eras.map(([l, y]) => `<button class="btn secondary small" data-era="${y}">${l}</button>`).join("")}</div>
      ${events.length ? `<div class="timeline" id="tl" tabindex="0" aria-label="Línea de tiempo. Usa las flechas para desplazarte.">
        <div class="track" style="width:${width}px">
          <div class="axis"></div>
          ${events.map((h, i) => {
            const up = i % 2 === 0; const color = REGIONS[h.region][1];
            const debates = S.questions.filter((q) => q.id === h.question).length;
            return `<div class="ev" style="left:${pos[i]}px;--ev:${color}" data-year="${h.year}">
              <div class="stem" style="${up ? "top:100px;height:75px" : "top:177px;height:58px"}"></div>
              <div class="pin"></div>
              <button style="${up ? "top:6px" : "top:235px"}" data-ev="${h.id}" aria-label="${rangeLabel(h.year, h.end)}: ${esc(h.title)}">
                <span class="ev-year">${rangeLabel(h.year, h.end)}</span>
                <span class="ev-title">${esc(h.title)}</span>
                ${debates ? `<span class="ev-debates">${plural(debates, "debate", "debates")}</span>` : ""}
              </button>
            </div>`;
          }).join("")}
        </div>
      </div>
      <div class="legend">${Object.values(REGIONS).map(([l, col]) => `<span><i style="background:${col}"></i>${l}</span>`).join("")}</div>`
      : `<div class="empty">No hay hitos con estos filtros.</div>`}
    </div>`;
  const tl = $("#tl");
  const scrollToYear = (year, smooth = true) => {
    if (!tl) return;
    const target = [...tl.querySelectorAll(".ev")].find((el) => Number(el.dataset.year) >= year) || tl.querySelector(".ev:last-child");
    if (target) tl.scrollTo({ left: target.offsetLeft - tl.clientWidth / 2 + 95, behavior: smooth && !matchMedia("(prefers-reduced-motion: reduce)").matches ? "smooth" : "auto" });
  };
  $("#view").querySelectorAll("[data-region]").forEach((b) => b.addEventListener("click", () => { ui.hRegion = b.dataset.region || null; viewHistory(new URLSearchParams()); }));
  $("#view").querySelectorAll("[data-theme-f]").forEach((b) => b.addEventListener("click", () => { ui.hTheme = b.dataset.themeF || null; viewHistory(new URLSearchParams()); }));
  $("#view").querySelectorAll("[data-era]").forEach((b) => b.addEventListener("click", () => scrollToYear(Number(b.dataset.era))));
  $("#view").querySelectorAll("[data-ev]").forEach((b) => b.addEventListener("click", () => showEvent(b.dataset.ev)));
  tl && tl.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") tl.scrollBy({ left: 220 }); if (e.key === "ArrowLeft") tl.scrollBy({ left: -220 }); });
  const focus = params.get("h");
  if (focus && tl) { const h = HISTORY.find((x) => x.id === focus); if (h) { requestAnimationFrame(() => scrollToYear(h.year, false)); showEvent(h.id); } }
  else requestAnimationFrame(() => scrollToYear(1800, false));
}

  reset && reset.addEventListener("click", () => {
    if (!confirm("¿Restablecer la demo? Se borrarán tus preguntas, votos y respuestas de prueba.")) return;
    S = seed(); save(); renderBell(); toast("Demo restablecida"); viewProfile();
  });
}

function viewNotFound(text) {
  setTab("", "");
  $("#view").innerHTML = `<div class="empty"><h2>No encontrado</h2><p>${esc(text)}</p><a class="btn" href="#/">Ir al inicio</a></div>`;
}

/* --- Notificaciones ----------------------------------------------------------- */
function renderBell() {
  const unread = S.notifications.filter((n) => !n.read).length;
  const badge = $("#bellBadge");
  badge.hidden = !unread; badge.textContent = unread;
  $("#bellBtn").setAttribute("aria-label", unread ? `Notificaciones, ${unread} sin leer` : "Notificaciones");
}
$("#bellBtn").addEventListener("click", () => {
  openSheet(`<h2>Notificaciones</h2>
    ${S.notifications.length ? S.notifications.map((n) => `<a class="notif ${n.read ? "" : "unread"}" href="${n.href}" data-close style="text-decoration:none"><b>${esc(n.title)}</b><span>${esc(n.text)}</span><span class="small muted">${ago(n.t)}</span></a>`).join("") : `<p class="muted">No tienes notificaciones.</p>`}
    <div style="margin-top:16px"><button class="btn secondary" data-close-btn>Cerrar</button></div>`);
  S.notifications.forEach((n) => (n.read = true)); save(); renderBell();
  $("#sheetBody").querySelectorAll("[data-close], [data-close-btn]").forEach((el) => el.addEventListener("click", closeSheet));
});

/* =====================================================================
   Router
   ===================================================================== */
function rerender() { route(true); }
function route(keepScroll = false) {
  const [path, query = ""] = (location.hash.slice(1) || "/").split("?");
  const params = new URLSearchParams(query);
  const parts = path.split("/").filter(Boolean);
  const y = window.scrollY;
  if (!keepScroll) closeSheet();
  if (!parts.length) viewHome();
  else if (parts[0] === "q" && parts[1]) {
    const q = S.questions.find((x) => x.id === parts[1]);
    if (q && !keepScroll) { q.views += 1; save(); }
    viewQuestion(parts[1]);
  }
  else if (parts[0] === "preguntar") viewAsk();
  else if (parts[0] === "explorar") viewExplore(params);
  else if (parts[0] === "historia") viewHistory(params);
  else if (parts[0] === "proyectos") viewProjects();
  else if (parts[0] === "p" && parts[1]) viewProject(parts[1]);
  else if (parts[0] === "perfil") viewProfile();
  else if (parts[0] === "u" && parts[1]) viewProfile(parts[1]);
  else viewNotFound("Esta página no existe.");
  if (keepScroll) window.scrollTo(0, y);
  else { window.scrollTo(0, 0); $("#view").focus({ preventScroll: true }); }
}
window.addEventListener("hashchange", () => route());

try { const th = localStorage.getItem("nexus-theme"); if (th && th !== "auto") document.documentElement.dataset.theme = th; } catch { /* sin almacenamiento */ }
renderBell();
route();
</script>
</body>
</html>
